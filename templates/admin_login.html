<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Pashynska Photography</title>
  <style>
    :root {
      --bg: #fbf7f4;
      --card: #fff;
      --ink: #2b2524;
      --muted: #766d69;
      --accent: #8d4f6f;
      --accent-dark: #703b56;
      --border: #eaded8;
      --error: #9f2f2f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    main {
      width: min(100%, 390px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 16px 50px rgba(70, 45, 38, 0.08);
    }

    .brand {
      font-family: Georgia, serif;
      font-size: 22px;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 12px;
      font: inherit;
      color: var(--ink);
      background: #fffdfc;
    }

    input:focus {
      outline: 2px solid rgba(141, 79, 111, 0.18);
      border-color: var(--accent);
    }

    button {
      width: 100%;
      min-height: 44px;
      margin-top: 22px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover { background: var(--accent-dark); }

    .error {
      margin: 0 0 18px;
      padding: 10px 12px;
      border-radius: 7px;
      background: #fff1f1;
      color: var(--error);
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">Pashynska Photography</div>
    <p class="sub">Booking admin</p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
      <input type="hidden" name="next" value="{{ next_url }}">

      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
