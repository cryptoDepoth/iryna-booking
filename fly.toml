# fly.toml app configuration file generated for iryna-booking
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'iryna-booking'
primary_region = 'sjc'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[env]
  DB_PATH            = "/data/bookings.db"
  BACKUP_DIR         = "/data/backups"
  EVENTS_YAML_PATH   = "/data/events.yaml"

[[mounts]]
  source = "booking_data"
  destination = "/data"
